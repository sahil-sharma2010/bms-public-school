<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMS School — Update Management</title>
    
    <!-- Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0c2348;
            --gold: #f4b400;
            --bg-color: #f4f6f9;
            --text-color: #333333;
            --text-muted: #64748b;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding-top: 90px; }
        
        /* Premium Admin Navbar */
        .admin-nav { position: fixed; top: 0; left: 0; width: 100%; background: var(--primary); height: 80px; display: flex; align-items: center; z-index: 1050; border-bottom: 3px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .admin-nav .navbar-brand { color: #fff; font-weight: 800; font-size: 24px; display: flex; align-items: center; gap: 15px;}
        .admin-nav .navbar-brand i { color: var(--gold); font-size: 28px;}
        .btn-outline-gold { background: transparent; color: var(--gold); border: 2px solid var(--gold); font-weight: 600; border-radius: 8px; padding: 8px 20px; transition: 0.3s;}
        .btn-outline-gold:hover { background: var(--gold); color: var(--primary); }
        .btn-gold { background: var(--gold); color: var(--primary); font-weight: 800; border-radius: 8px; padding: 14px 20px; text-transform: uppercase; transition: 0.3s; border: none;}
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(244, 180, 0, 0.3); }

        /* Premium Cards */
        .admin-card { background: #fff; border-radius: 16px; padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); margin-bottom: 30px;}
        .admin-card-title { font-weight: 800; color: var(--primary); font-size: 22px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px;}
        .admin-card-subtitle { font-weight: 500; color: var(--text-muted); font-size: 14px; margin-bottom: 25px;}
        
        /* Form Inputs */
        .form-label { font-weight: 700; color: var(--primary); font-size: 14px; margin-bottom: 8px;}
        .form-control, .form-select { border-radius: 8px; border: 1px solid #dee2e6; padding: 12px 15px; font-weight: 500; color: #495057; transition: 0.3s; box-shadow: none !important;}
        .form-control:focus, .form-select:focus { border-color: var(--primary); }
        
        /* Preview Box */
        .preview-box { background: rgba(12, 35, 72, 0.05); border-left: 4px solid var(--primary); padding: 15px 20px; border-radius: 8px; font-weight: 500; color: var(--primary); display: flex; align-items: center; gap: 10px; margin-top: 10px;}
        .preview-box i { color: var(--gold); font-size: 20px;}

        /* Update List Item */
        .update-list-item { background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); transition: 0.3s; position: relative;}
        .update-list-item:hover { border-color: var(--gold); box-shadow: 0 10px 25px rgba(0,0,0,0.08); transform: translateX(5px);}
        .status-badge { position: absolute; top: 20px; right: 20px; font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 50px;}
        .status-active { background: rgba(40, 167, 69, 0.1); color: #28a745; border: 1px solid #28a745;}
        .status-expiring { background: rgba(255, 193, 7, 0.1); color: #d39e00; border: 1px solid #ffc107; animation: blink 2s infinite;}
        .status-expired { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid #dc3545;}
        @keyframes blink { 50% { opacity: 0.6; } }

        .up-title { font-weight: 800; color: var(--primary); font-size: 18px; margin-bottom: 5px;}
        .up-meta { font-size: 13.5px; color: var(--text-muted); font-weight: 500; margin-bottom: 15px;}
        .up-actions { display: flex; gap: 10px; }
        .btn-action { font-size: 13px; font-weight: 700; padding: 6px 15px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s;}

        @media (max-width: 991px) {
            .admin-nav { padding: 0 15px; }
            .admin-nav .navbar-brand { font-size: 18px; }
            .admin-card { padding: 25px 20px; }
            .status-badge { position: relative; top: 0; right: 0; display: inline-block; margin-bottom: 10px;}
            .up-actions { flex-wrap: wrap; }
            .btn-action { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Admin Navbar -->
    <nav class="navbar admin-nav">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-school"></i> BMS School — Update Management</a>
            <a href="index.html" class="btn btn-outline-gold d-none d-sm-block"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
            <a href="index.html" class="btn btn-outline-gold d-block d-sm-none px-2"><i class="fa-solid fa-house"></i></a>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row g-4">
            <!-- Left Column: Create Form -->
            <div class="col-lg-5">
                <div class="admin-card">
                    <h2 class="admin-card-title"><i class="fa-solid fa-pen-to-square"></i> Create New Update</h2>
                    <p class="admin-card-subtitle">Publish important school announcements immediately.</p>
                    
                    <form id="updateForm" onsubmit="event.preventDefault(); publishUpdate();">
                        <input type="hidden" id="edit-id">
                        
                        <div class="mb-3">
                            <label class="form-label">Update Type</label>
                            <select class="form-select" id="up-type" required>
                                <option value="Notice">📢 Notice</option>
                                <option value="Holiday">📅 Holiday</option>
                                <option value="Festival">🎉 Festival</option>
                                <option value="Result">🏆 Result</option>
                                <option value="Important Announcement" selected>🔔 Important Announcement</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Update Title</label>
                            <input type="text" class="form-control" id="up-title" placeholder="e.g., Summer Vacation Notice" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Update Message</label>
                            <textarea class="form-control" id="up-desc" rows="3" placeholder="e.g., Summer vacation will begin from 1 June 2026." required></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Published Date</label>
                                <input type="date" class="form-control" id="up-pub-date" required onchange="calculateExpiry()">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Published Time</label>
                                <input type="time" class="form-control" id="up-pub-time" required onchange="calculateExpiry()">
                            </div>
                        </div>

                        <label class="form-label mt-2">Display Duration</label>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <input type="number" class="form-control" id="up-dur-val" value="30" min="1" required oninput="calculateExpiry()">
                            </div>
                            <div class="col-6">
                                <select class="form-select" id="up-dur-unit" onchange="calculateExpiry()">
                                    <option value="Hours">Hours</option>
                                    <option value="Days" selected>Days</option>
                                    <option value="Weeks">Weeks</option>
                                    <option value="Months">Months</option>
                                </select>
                            </div>
                        </div>

                        <div class="preview-box">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <div>
                                <span class="text-muted d-block" style="font-size:12px;">Update will automatically hide on:</span>
                                <strong id="preview-time">Calculating...</strong>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 mt-4" id="submit-btn"><i class="fa-solid fa-paper-plane"></i> Publish Update</button>
                        <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="cancel-edit-btn" onclick="cancelEdit()">Cancel Edit</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Active Updates -->
            <div class="col-lg-7">
                <div class="admin-card h-100">
                    <h2 class="admin-card-title"><i class="fa-solid fa-list-check"></i> Active Updates</h2>
                    <p class="admin-card-subtitle">Manage and monitor live updates.</p>
                    
                    <div id="admin-updates-list">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        let updates = JSON.parse(localStorage.getItem('bms_updates')) || [];

        // Set default Date/Time
        function setDefaults() {
            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            document.getElementById('up-pub-date').value = `${year}-${month}-${day}`;
            
            let hours = String(now.getHours()).padStart(2, '0');
            let mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('up-pub-time').value = `${hours}:${mins}`;
            
            calculateExpiry();
        }

        // Calculate Expiry Date automatically
        function calculateExpiry() {
            let dateVal = document.getElementById('up-pub-date').value;
            let timeVal = document.getElementById('up-pub-time').value;
            let durVal = parseInt(document.getElementById('up-dur-val').value) || 0;
            let durUnit = document.getElementById('up-dur-unit').value;

            if(!dateVal || !timeVal) return null;

            let d = new Date(`${dateVal}T${timeVal}`);
            if (durUnit === 'Hours') d.setHours(d.getHours() + durVal);
            else if (durUnit === 'Days') d.setDate(d.getDate() + durVal);
            else if (durUnit === 'Weeks') d.setDate(d.getDate() + durVal * 7);
            else if (durUnit === 'Months') d.setMonth(d.getMonth() + durVal);

            let options = { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            document.getElementById('preview-time').innerText = `Visible until: ${d.toLocaleString('en-GB', options)}`;
            
            return d.toISOString();
        }

        // Save / Publish Update
        function publishUpdate() {
            let id = document.getElementById('edit-id').value;
            let type = document.getElementById('up-type').value;
            let title = document.getElementById('up-title').value.trim();
            let desc = document.getElementById('up-desc').value.trim();
            let pubDate = document.getElementById('up-pub-date').value;
            let pubTime = document.getElementById('up-pub-time').value;
            let expiryDateISO = calculateExpiry();

            if(id) {
                let index = updates.findIndex(u => u.id == id);
                if(index > -1) {
                    updates[index] = { id, type, title, desc, pubDateStr: `${pubDate}T${pubTime}`, expiryDate: expiryDateISO };
                }
            } else {
                let newUpdate = { id: Date.now().toString(), type, title, desc, pubDateStr: `${pubDate}T${pubTime}`, expiryDate: expiryDateISO };
                updates.push(newUpdate);
            }

            localStorage.setItem('bms_updates', JSON.stringify(updates));
            
            Swal.fire({
                title: 'Update Published Successfully',
                text: 'Your update is now live on the website.',
                icon: 'success',
                confirmButtonColor: '#0c2348'
            });

            cancelEdit();
            renderAdminUpdates();
        }

        function cancelEdit() {
            document.getElementById('updateForm').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('submit-btn').innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Update';
            document.getElementById('cancel-edit-btn').classList.add('d-none');
            setDefaults();
        }

        function editUpdate(id) {
            let up = updates.find(u => u.id == id);
            if(!up) return;
            
            document.getElementById('edit-id').value = up.id;
            
            let select = document.getElementById('up-type');
            for(let i=0; i<select.options.length; i++) {
                if(select.options[i].value === up.type) select.selectedIndex = i;
            }

            document.getElementById('up-title').value = up.title;
            document.getElementById('up-desc').value = up.desc;
            
            let pDate = new Date(up.pubDateStr);
            document.getElementById('up-pub-date').value = `${pDate.getFullYear()}-${String(pDate.getMonth()+1).padStart(2,'0')}-${String(pDate.getDate()).padStart(2,'0')}`;
            document.getElementById('up-pub-time').value = `${String(pDate.getHours()).padStart(2,'0')}:${String(pDate.getMinutes()).padStart(2,'0')}`;
            
            document.getElementById('submit-btn').innerHTML = '<i class="fa-solid fa-save"></i> Save Changes';
            document.getElementById('cancel-edit-btn').classList.remove('d-none');
            calculateExpiry();
        }

        function expireNow(id) {
            Swal.fire({
                title: 'Are you sure?',
                text: "This will immediately hide the update from the website.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, expire it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    let index = updates.findIndex(u => u.id == id);
                    if(index > -1) {
                        updates[index].expiryDate = new Date().toISOString();
                        localStorage.setItem('bms_updates', JSON.stringify(updates));
                        renderAdminUpdates();
                        Swal.fire('Expired!', 'Update has been removed from Home Page.', 'success');
                    }
                }
            });
        }

        function deleteUpdate(id) {
            Swal.fire({
                title: 'Delete Update?',
                text: "You won't be able to revert this!",
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    updates = updates.filter(u => u.id != id);
                    localStorage.setItem('bms_updates', JSON.stringify(updates));
                    renderAdminUpdates();
                }
            });
        }

        function renderAdminUpdates() {
            let container = document.getElementById('admin-updates-list');
            let now = new Date();
            
            if(updates.length === 0) {
                container.innerHTML = `<div class="text-center py-5"><i class="fa-regular fa-folder-open fs-1 text-muted mb-3"></i><p class="text-muted fw-bold">No updates found.</p></div>`;
                return;
            }

            // Sort newest first based on pubDate
            let sorted = [...updates].sort((a,b) => new Date(b.pubDateStr) - new Date(a.pubDateStr));
            let html = '';

            sorted.forEach(up => {
                let expDate = new Date(up.expiryDate);
                let pubDate = new Date(up.pubDateStr);
                
                let diffHours = (expDate - now) / (1000 * 60 * 60);
                
                let statusClass = '';
                let statusText = '';
                
                if (now >= expDate) {
                    statusClass = 'status-expired';
                    statusText = 'EXPIRED';
                } else if (diffHours <= 24) {
                    statusClass = 'status-expiring';
                    statusText = 'EXPIRING SOON';
                } else {
                    statusClass = 'status-active';
                    statusText = 'ACTIVE';
                }

                let opt = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };

                html += `
                <div class="update-list-item">
                    <span class="status-badge ${statusClass}">${statusText}</span>
                    <div class="up-title">${up.type} - ${up.title}</div>
                    <div class="up-meta">
                        <i class="fa-solid fa-clock text-gold"></i> Published: ${pubDate.toLocaleString('en-GB', opt)}<br>
                        <i class="fa-solid fa-hourglass-end text-danger mt-1"></i> Expires: ${expDate.toLocaleString('en-GB', opt)}
                    </div>
                    <div class="up-actions">
                        <button class="btn btn-outline-primary btn-action" onclick="editUpdate('${up.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                        ${now < expDate ? `<button class="btn btn-outline-warning btn-action" onclick="expireNow('${up.id}')"><i class="fa-solid fa-eye-slash"></i> Expire Now</button>` : ''}
                        <button class="btn btn-outline-danger btn-action" onclick="deleteUpdate('${up.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        window.onload = () => {
            setDefaults()
